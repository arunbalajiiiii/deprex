<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deprex — Mental Health Risk Monitoring & AI Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary: #8b5cf6;
        --primary-glow: rgba(139, 92, 246, 0.35);
        --accent-blue: #3b82f6;
        --bg-dark: #080811;
        --card-bg: rgba(255, 255, 255, 0.03);
        --card-border: rgba(139, 92, 246, 0.16);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--bg-dark);
        color: #f8fafc;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(8, 8, 17, 0.8);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(139, 92, 246, 0.3);
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(139, 92, 246, 0.6);
      }

      /* Keyframe animations */
      @keyframes pulseGlow {
        0% { box-shadow: 0 0 15px rgba(139, 92, 246, 0.2); }
        100% { box-shadow: 0 0 30px rgba(139, 92, 246, 0.5); }
      }

      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      @keyframes boxBreathe {
        0%, 100% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 25px rgba(168, 85, 247, 0.3); }
        25% { transform: scale(1.45); opacity: 1; box-shadow: 0 0 55px rgba(168, 85, 247, 0.7); }
        50% { transform: scale(1.45); opacity: 1; box-shadow: 0 0 55px rgba(168, 85, 247, 0.7); }
        75% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 25px rgba(168, 85, 247, 0.3); }
      }

      @keyframes bop {
        0%, 80%, 100% { transform: translateY(0); }
        40% { transform: translateY(-6px); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
